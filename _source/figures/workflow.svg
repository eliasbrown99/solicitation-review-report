<svg xmlns="http://www.w3.org/2000/svg" width="430" height="755" viewBox="0 0 430 755" role="img" aria-labelledby="title desc"><title id="title">From solicitation to saved digest</title><desc id="desc">Read top to bottom. An uploaded file is parsed, divided into sections, filtered for relevance, summarized, and stored for human review. Excluded sections do not reach the summary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#78572f"/></marker></defs><rect width="100%" height="100%" fill="#f7f2e8"/><g font-family="Arial, sans-serif" fill="#302923"><rect x="10" y="12" width="410" height="111" rx="3" fill="#eee5d8" stroke="#dcd2c3"/><text x="28" y="41" font-size="18" font-weight="bold">01  Upload &amp; parse</text><text x="28" y="67" font-size="15">PDF or Word → Markdown</text><text x="28" y="90" font-size="15">LlamaParse extracts text and headings</text><path d="M215 123L215 152" stroke="#78572f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="10" y="160" width="410" height="111" rx="3" fill="#eee5d8" stroke="#dcd2c3"/><text x="28" y="189" font-size="18" font-weight="bold">02  Build sections</text><text x="28" y="215" font-size="15">Check heading numbering with an LLM</text><text x="28" y="238" font-size="15">Flatten retained headings into sections</text><path d="M215 271L215 300" stroke="#78572f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="10" y="308" width="410" height="111" rx="3" fill="#eee5d8" stroke="#dcd2c3"/><text x="28" y="337" font-size="18" font-weight="bold">03  Select relevant material</text><text x="28" y="363" font-size="15">Heading + first 1,000 characters</text><text x="28" y="386" font-size="15">Excluded sections stop here</text><path d="M215 419L215 448" stroke="#78572f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="10" y="456" width="410" height="111" rx="3" fill="#eee5d8" stroke="#dcd2c3"/><text x="28" y="485" font-size="18" font-weight="bold">04  Summarize &amp; condense</text><text x="28" y="511" font-size="15">2,000-character chunks; 100 overlap</text><text x="28" y="534" font-size="15">Prompt requests ≤5 bullets per section</text><path d="M215 567L215 596" stroke="#78572f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="10" y="604" width="410" height="111" rx="3" fill="#eee5d8" stroke="#dcd2c3"/><text x="28" y="633" font-size="18" font-weight="bold">05  Save &amp; review</text><text x="28" y="659" font-size="15">JSON text in SQLite → React interface</text><text x="28" y="682" font-size="15">Search, reopen, or delete saved results</text></g></svg>