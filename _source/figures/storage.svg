<svg xmlns="http://www.w3.org/2000/svg" width="430" height="580" viewBox="0 0 430 580" role="img" aria-labelledby="title desc"><title id="title">One saved row contains a list of sections</title><desc id="desc">The summaries table has id, filename, upload_time, and summary. The summary field is JSON text holding a list of heading and summary objects, not a separate relational section table.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#78572f"/></marker></defs><rect width="100%" height="100%" fill="#f7f2e8"/><g font-family="Arial, sans-serif" fill="#302923"><rect x="10" y="12" width="410" height="190" rx="3" fill="#eee5d8" stroke="#dcd2c3"/><text x="28" y="41" font-size="18" font-weight="bold">SQLite: summaries table</text><text x="28" y="67" font-size="15">id — primary key</text><text x="28" y="90" font-size="15">filename — uploaded name</text><text x="28" y="113" font-size="15">upload_time — saved timestamp</text><text x="28" y="136" font-size="15">summary — JSON serialized as TEXT</text><path d="M215 202L215 252" stroke="#78572f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="10" y="268" width="410" height="127" rx="3" fill="#eee5d8" stroke="#dcd2c3"/><text x="28" y="297" font-size="18" font-weight="bold">Inside the summary field</text><text x="28" y="323" font-size="15">A list of section objects</text><text x="28" y="346" font-size="15">Each has: heading + summary</text><text x="28" y="369" font-size="15">One document row → many sections</text><path d="M215 395L215 445" stroke="#78572f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="10" y="461" width="410" height="105" rx="3" fill="#eee5d8" stroke="#dcd2c3"/><text x="28" y="490" font-size="18" font-weight="bold">Displayed in the interface</text><text x="28" y="516" font-size="15">Heading followed by summary bullets</text><text x="28" y="539" font-size="15">No page-level source citations stored</text></g></svg>